name: automerge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
  schedule:
    - cron: "7 6,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  automerge:
    uses: Emkraan/.github/.github/workflows/reusable-automerge.yml@main
    with:
      runs-on: '"ubuntu-latest"'
      app-client-id: ${{ vars.DEPLOY_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
